# Local / Dokploy-aligned Docker stack (Postgres & MinIO are external — set in Server/.env)
#
#   cp Server/.env.example Server/.env
#   docker compose up --build
#
#   Frontend → http://localhost:8080
#   Backend  → http://localhost:8070  (admin at /admin/dashboard.html)

services:
  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: orewire-server
    ports:
      - "${SERVER_PORT:-8070}:8070"
    env_file:
      - ./Server/.env
    environment:
      PORT: "8070"
      DOWNLOADS_DIR: ./data/downloads
      COOKIE_FILE: ./data/cookies.json
    volumes:
      - server-data:/app/data
      # Shared with the tunnel container: the admin panel writes the laptop's
      # public key here, sshd reads it on each connection.
      - tunnel-keys:/keys
    shm_size: "1gb"
    restart: unless-stopped

  # Reverse-tunnel endpoint for the laptop proxy (optional).
  # The backend reaches it at the stable name `tunnel:8888` — no host sshd
  # changes, and no docker gateway address that shifts when the network is
  # recreated. Only starts if you supply a key:
  #   TUNNEL_AUTHORIZED_KEY="$(cat ~/.ssh/orewire-tunnel.pub)" docker compose up -d
  tunnel:
    build:
      context: ./Server/deploy/home-proxy/tunnel
    container_name: orewire-tunnel
    profiles: ["tunnel"]
    ports:
      - "${TUNNEL_SSH_PORT:-2222}:22"
    environment:
      TUNNEL_AUTHORIZED_KEY: "${TUNNEL_AUTHORIZED_KEY:-}"
      TUNNEL_LISTEN_PORT: "8888"
    volumes:
      - tunnel-hostkeys:/etc/ssh/keys
      - tunnel-keys:/keys
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8070/api}
        VITE_FRONTEND_DOMAIN: ${VITE_FRONTEND_DOMAIN:-localhost:8080}
        VITE_BACKEND_DOMAIN: ${VITE_BACKEND_DOMAIN:-localhost:8070}
    container_name: orewire-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  server-data:
  tunnel-hostkeys:
  tunnel-keys:
