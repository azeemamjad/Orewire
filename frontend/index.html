    <!--
      Deliberately NO canonical here.

      nginx serves this one shell for every non-proxied path, so a hardcoded
      canonical points every client-rendered route at the homepage. This file had
      `rel="canonical" href="https://www.orewire.com/"`, which told a crawler that
      /insider/<slug>, /login, /watchlist and every other unwired route were
      duplicates of `/` — and a crawler that does not run JavaScript would take
      that at face value and drop them.

      Routes that need a canonical set their own through useSeo(). Where none is
      set, the absence of a canonical is correct: the page self-canonicalises,
      which is the right answer for a route this file cannot know about.
    -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Entity markup in the static shell.

      Individual pages update these nodes at runtime, and crawler requests are
      served fully rendered HTML by the backend. Having the organisation and site
      entities in the static HTML as well means the site is identifiable to any
      crawler that never executes JavaScript.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.orewire.com/#organization",
          "name": "OreWire",
          "alternateName": "OreWire Mining Intelligence",
          "url": "https://www.orewire.com/",
          "description": "OreWire publishes stock prices, decoded regulatory filings and news release summaries for mining and resource companies listed on the TSX, TSX-V, CSE and ASX.",
          "email": "hello@orewire.com",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "hello@orewire.com",
            "url": "https://www.orewire.com/contact"
          },
          "knowsAbout": [
            "mining stocks",
            "mineral exploration",
            "regulatory filings",
            "SEDAR+",
            "junior mining companies",
            "resource investing"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.orewire.com/#website",
          "url": "https://www.orewire.com/",
          "name": "OreWire",
          "publisher": { "@id": "https://www.orewire.com/#organization" },
          "inLanguage": "en"
        }
      ]
    }
    </script>
