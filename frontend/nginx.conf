# OreWire frontend (nginx).
#
# This file is a TEMPLATE. The Dockerfile copies it to
# /etc/nginx/templates/default.conf.template, and the official nginx entrypoint
# runs envsubst over it, replacing ${BACKEND_UPSTREAM}. Do not remove that
# placeholder or the entrypoint will leave the crawler proxy pointing nowhere.
#
# Routing model
# -------------
# Normal visitors get the React SPA, unchanged.
# Crawlers get fully populated server rendered HTML from the backend for the
# content routes (/company, /companies, /news, /filings). This is the technique
# Google documents as "dynamic rendering": the crawler receives the same facts
# the SPA renders from the same API, so the two views agree.
#
# /robots.txt is served as a static file so it can never 502.
# /sitemap.xml, /sitemaps/*.xml and /llms.txt are generated by the backend.

# Runtime DNS so a wrong or missing backend host degrades to an error on the
# crawler routes only, instead of stopping nginx from booting.
resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;

# 1 = crawler, 0 = ordinary browser.
map $http_user_agent $orewire_crawler {
    default 0;

    # Search engines
    "~*(?i)googlebot"            1;
    "~*(?i)google-inspectiontool" 1;
    "~*(?i)apis-google"          1;
    "~*(?i)bingbot"              1;
    "~*(?i)adidxbot"             1;
    "~*(?i)slurp"                1;
    "~*(?i)duckduckbot"          1;
    "~*(?i)baiduspider"          1;
    "~*(?i)yandex"               1;
    "~*(?i)sogou"                1;
    "~*(?i)exabot"               1;
    "~*(?i)ia_archiver"          1;

    # AI and answer engines
    "~*(?i)gptbot"               1;
    "~*(?i)oai-searchbot"        1;
    "~*(?i)chatgpt-user"         1;
    "~*(?i)perplexitybot"        1;
    "~*(?i)perplexity-user"      1;
    "~*(?i)claudebot"            1;
    "~*(?i)claude-user"          1;
    "~*(?i)claude-searchbot"     1;
    "~*(?i)anthropic-ai"         1;
    "~*(?i)google-extended"      1;
    "~*(?i)applebot"             1;
    "~*(?i)amazonbot"            1;
    "~*(?i)meta-externalagent"   1;
    "~*(?i)cohere-ai"            1;
    "~*(?i)mistralai-user"       1;
    "~*(?i)youbot"               1;
    "~*(?i)ccbot"                1;
    "~*(?i)bytespider"           1;
    "~*(?i)petalbot"             1;

    # Social and messaging unfurlers
    "~*(?i)twitterbot"           1;
    "~*(?i)facebookexternalhit"  1;
    "~*(?i)facebookcatalog"      1;
    "~*(?i)linkedinbot"          1;
    "~*(?i)slackbot"             1;
    "~*(?i)telegrambot"          1;
    "~*(?i)whatsapp"             1;
    "~*(?i)discordbot"           1;
    "~*(?i)embedly"              1;
    "~*(?i)pinterest"            1;

    # SEO tooling worth rendering for
    "~*(?i)ahrefs"               1;
    "~*(?i)semrush"              1;
    "~*(?i)screaming frog"       1;
    "~*(?i)sitebulb"             1;
}

# Operator escape hatch for a newly launched crawler.
#
# New AI and search crawlers appear regularly, and the failure mode when one is
# missing from the map above is silent: the bot receives the empty SPA shell, the
# site looks fine in a browser, and nothing anywhere reports a problem. This lets
# an operator fix that with one environment variable and a restart, instead of an
# nginx edit, a rebuild and a redeploy.
#
# EXTRA_CRAWLER_UA_PATTERN is inserted verbatim as a map mask, so it must include
# its own match operator, for example:
#
#     EXTRA_CRAWLER_UA_PATTERN=~*newai-bot
#
# The Dockerfile gives it a default of `~*orewire-never-matches`, a valid regex
# that matches no real User-Agent. That default is deliberate: substituting an
# empty value here would leave a bare `""` map mask, and a malformed mask stops
# nginx from starting, which takes the whole frontend down. A never-matching
# regex cannot do that.
#
# If the leading `~` or `~*` is left off, the value becomes an exact match and
# will not match a real User-Agent: it fails safe, serving the SPA rather than
# rendered HTML, and never the reverse.
map $http_user_agent $orewire_extra_crawler {
    default 0;
    "${EXTRA_CRAWLER_UA_PATTERN}" 1;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Backend that renders crawler HTML. Override with BACKEND_UPSTREAM.
    set $orewire_backend "${BACKEND_UPSTREAM}";

    # ---- Generated machine readable files (always from the backend) ----------

    location = /sitemap.xml {
        proxy_pass $orewire_backend;
        include /etc/nginx/conf.d/orewire-proxy-headers.inc;
    }

    location ^~ /sitemaps/ {
        proxy_pass $orewire_backend;
        include /etc/nginx/conf.d/orewire-proxy-headers.inc;
    }

    location = /llms.txt {
        proxy_pass $orewire_backend;
        include /etc/nginx/conf.d/orewire-proxy-headers.inc;
    }

    # IndexNow key file, e.g. /a1b2c3d4e5f6.txt. IndexNow verifies ownership by
    # fetching this from the site root, so it cannot be allowed to fall through
    # to the SPA (which would return index.html and fail verification).
    # The regex is quoted because it contains a `}` quantifier, which nginx
    # would otherwise read as the end of a block. /robots.txt is unaffected: it
    # falls to `location /` and is served as a static file, because "robots" is
    # six characters and the quantifier below demands at least eight.
    location ~ "^/[A-Za-z0-9-]{8,128}\.txt$" {
        proxy_pass $orewire_backend;
        include /etc/nginx/conf.d/orewire-proxy-headers.inc;
    }

    # ---- Crawler rendered content routes ------------------------------------

    # These URLs answer with the SPA shell for a person and rendered HTML for a
    # crawler, chosen by User-Agent. An edge cache keyed on the URL alone cannot
    # tell those apart, and if it stored the shell a later crawler request would
    # be answered from cache and never reach the renderer at all, silently
    # defeating the whole setup.
    #
    # The no-cache policy for the shell is set in `location /` rather than here,
    # on purpose: try_files performs an INTERNAL REDIRECT to /index.html, which
    # re-runs location matching, so any add_header set here would be discarded by
    # the time the file is served.
    location ~ ^/(company|companies|news|filings|market-news)(/|$) {
        error_page 418 = @orewire_ssr;
        # The explicit crawler list and the operator's optional pattern,
        # concatenated: "00" is a browser, anything containing a "1" is a crawler.
        if ($orewire_crawler$orewire_extra_crawler ~ "1") {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @orewire_ssr {
        proxy_pass $orewire_backend;
        include /etc/nginx/conf.d/orewire-proxy-headers.inc;
    }

    # ---- Everything else is the SPA -----------------------------------------

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The SPA shell. Marked revalidate-always so a cache can never answer a
    # crawler request with a stored shell, and Vary is the correct signal for
    # spec-compliant caches (Cloudflare ignores Vary for its cache key, which is
    # why no-cache is doing the real work). Crawler HTML is sent no-store by the
    # backend, closing the other direction.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Vary "User-Agent" always;
        try_files $uri $uri/ /index.html;
    }
}
