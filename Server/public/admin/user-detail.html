<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Detail | OreWire Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css" />
  <style>
    nav li a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 8px; width: 100%; }
    .user-actions { display: flex; flex-wrap: wrap; gap: 4px; }
    .user-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      max-width: 720px;
    }
    .user-card .detail-row { display: grid; grid-template-columns: 180px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .user-card .detail-row:last-child { border-bottom: none; }
    .user-card .detail-label { color: var(--muted); font-size: 13px; }
    .user-card .detail-value { font-size: 14px; word-break: break-word; }
    .user-detail-header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .back-link { font-size: 13px; color: var(--muted); text-decoration: none; }
    .back-link:hover { color: var(--text); }
  </style>
</head>
<body data-page="users">
<aside class="sidebar"></aside>
<main class="main">
  <div class="page-header">
    <div class="user-detail-header">
      <a class="back-link" href="/admin/users.html">← Back to users</a>
    </div>
    <h1 id="ud-title">User</h1>
    <p id="ud-subtitle">Loading…</p>
  </div>

  <div class="user-card" id="ud-card">
    <div class="loading">Loading user…</div>
  </div>

  <h2 class="section-title" style="margin-top:24px;">Last 10 pages visited</h2>
  <div class="table-wrap user-card" style="max-width:720px;padding:0;">
    <table>
      <thead><tr><th>Page</th><th>Visited at</th></tr></thead>
      <tbody id="ud-pages-body">
        <tr class="empty-row"><td colspan="2">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
    <button class="btn btn-primary btn-sm" type="button" onclick="detailResetPassword(true)">📧 Send new password</button>
    <button class="btn btn-ghost btn-sm" type="button" onclick="detailResetPassword(false)">🔑 Generate temp password</button>
  </div>
</main>

<div class="modal-backdrop" id="temp-pw-modal" onclick="if(event.target===this)closeTempPwModal()">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <h2>Temporary password</h2>
      <button class="modal-close" type="button" onclick="closeTempPwModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:14px;color:var(--muted);margin:0 0 12px;">Copy this password now — it won't be shown again.</p>
      <div id="temp-pw-value" style="font-family:monospace;font-size:20px;font-weight:700;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:6px;letter-spacing:1px;"></div>
      <p id="temp-pw-email-note" style="font-size:13px;margin:12px 0 0;color:var(--muted);"></p>
      <div style="margin-top:16px;text-align:right;">
        <button type="button" class="btn btn-primary btn-sm" onclick="closeTempPwModal()">Done</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/admin/js/admin-sidebar.js?v=20260720"></script>
<script src="/admin/js/legacy-admin.js"></script>
<script>
  const _udId = parseInt(new URLSearchParams(window.location.search).get('id'), 10);

  function fmtDate(v) {
    if (!v) return 'N/A';
    const d = new Date(v);
    return isNaN(d) ? 'N/A' : d.toLocaleString();
  }
  function yesNo(v) { return v ? '✓ Yes' : '✗ No'; }

  async function loadUserDetail() {
    const card = document.getElementById('ud-card');
    if (!Number.isFinite(_udId)) {
      document.getElementById('ud-subtitle').textContent = 'Invalid user id in URL.';
      card.innerHTML = '<p style="color:var(--danger);">No valid user id specified.</p>';
      return;
    }
    try {
      const d = await fetch(`/api/admin/users/${_udId}`).then(async (r) => {
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || `Server error (${r.status})`);
        return j;
      });
      const u = d.user;
      const name = u.name || [u.firstName, u.lastName].filter(Boolean).join(' ') || 'N/A';

      document.title = `${name} | OreWire Admin`;
      document.getElementById('ud-title').textContent = name;
      document.getElementById('ud-subtitle').textContent = `${u.email} — user #${u.id}`;
      document.querySelector('.admin-topbar-subtitle')?.replaceChildren(
        document.createTextNode(`Users — ${name}`),
      );

      const briefing = d.briefingSubscription
        ? `${d.briefingSubscription.active ? 'Subscribed' : 'Unsubscribed'} (since ${fmtDate(d.briefingSubscription.createdAt)})`
        : 'Not subscribed';

      card.innerHTML = `
        <div class="detail-row"><div class="detail-label">User ID</div><div class="detail-value">${u.id}</div></div>
        <div class="detail-row"><div class="detail-label">First name</div><div class="detail-value">${esc(u.firstName || 'N/A')}</div></div>
        <div class="detail-row"><div class="detail-label">Last name</div><div class="detail-value">${esc(u.lastName || 'N/A')}</div></div>
        <div class="detail-row"><div class="detail-label">Email</div><div class="detail-value">${esc(u.email)}</div></div>
        <div class="detail-row"><div class="detail-label">Username</div><div class="detail-value">${esc(u.username || 'N/A')}</div></div>
        <div class="detail-row"><div class="detail-label">Company</div><div class="detail-value">${esc(u.company || 'N/A')}</div></div>
        <div class="detail-row"><div class="detail-label">Email verified</div><div class="detail-value">${yesNo(u.emailVerified)}</div></div>
        <div class="detail-row"><div class="detail-label">Two-step auth</div><div class="detail-value">${yesNo(u.twoStepEnabled)}</div></div>
        <div class="detail-row"><div class="detail-label">Briefing emails</div><div class="detail-value">${yesNo(u.briefingEnabled)}</div></div>
        <div class="detail-row"><div class="detail-label">Watchlist alerts</div><div class="detail-value">${yesNo(u.watchlistAlertsEnabled)}</div></div>
        <div class="detail-row"><div class="detail-label">Must change password</div><div class="detail-value">${yesNo(u.mustChangePassword)}</div></div>
        <div class="detail-row"><div class="detail-label">Created by admin</div><div class="detail-value">${yesNo(u.createdByAdmin)}</div></div>
        <div class="detail-row"><div class="detail-label">Password last set</div><div class="detail-value">${fmtDate(u.passwordSetAt)}</div></div>
        <div class="detail-row"><div class="detail-label">Signed up</div><div class="detail-value">${fmtDate(u.createdAt)}</div></div>
        <div class="detail-row"><div class="detail-label">Last live</div><div class="detail-value">${u.lastLiveAt ? '🟢 ' + fmtDate(u.lastLiveAt) : 'Never seen online'}</div></div>
        <div class="detail-row"><div class="detail-label">Watchlist items</div><div class="detail-value">${d.watchlistCount ?? 0}</div></div>
        <div class="detail-row"><div class="detail-label">Briefing subscription</div><div class="detail-value">${briefing}</div></div>
      `;

      const pagesBody = document.getElementById('ud-pages-body');
      if (pagesBody) {
        const pages = d.recentPages || [];
        pagesBody.innerHTML = pages.length
          ? pages.map((p) => `
              <tr>
                <td style="font-family:monospace;font-size:13px;">${esc(p.path)}</td>
                <td style="font-size:12px;color:var(--muted);">${fmtDate(p.visitedAt)}</td>
              </tr>`).join('')
          : '<tr class="empty-row"><td colspan="2">No page visits recorded yet.</td></tr>';
      }
    } catch (err) {
      card.innerHTML = `<p style="color:var(--danger);">Error: ${esc(err.message)}</p>`;
      document.getElementById('ud-subtitle').textContent = 'Failed to load user';
    }
  }

  async function detailResetPassword(sendEmail) {
    if (!Number.isFinite(_udId)) return;
    await resetUserPassword(_udId, sendEmail);
    loadUserDetail();
  }

  document.addEventListener('DOMContentLoaded', loadUserDetail);
</script>
</body>
</html>
