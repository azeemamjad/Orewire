# Transparent front for the open/click tracking hosts (track.<sending-domain>).
#
# Postal only treats a request as tracking traffic when it carries
# `X-Postal-Track-Host: 1` (see lib/tracking_middleware.rb: it is inserted before
# ActionDispatch::HostAuthorization and short-circuits host checks). Without the
# header, any host other than postal.web_hostname gets a bare 403 from Rails:
#
#   $ curl -s -o /dev/null -w '%{http_code}' https://track.getorewire.com/img/x/y
#   403
#
# Traefik sends the request straight to postal-web:5000 and cannot add the header
# on its own here (Dokploy owns the routers), so this tiny proxy adds it and
# forwards. Dokploy routes the three track.* hostnames to this service on port 80.
server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, resolved per-request so a postal-web restart can't
    # leave a stale upstream IP behind.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $postal_web postal-web:5000;

    location / {
        proxy_pass http://$postal_web;
        proxy_http_version 1.1;

        # The header that makes Postal run TrackingMiddleware.
        proxy_set_header X-Postal-Track-Host 1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
