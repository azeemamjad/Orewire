# OreWire email outreach stack — single-compose deployment (Postal + Listmonk + Console + Reacher)
#
# ZERO-CONFIG: every variable has a baked-in default — deploys with no .env needed.
# Override anything via Dokploy's environment editor if you want different values.
#
# Dokploy: service type **Compose**, Compose file path: ./email-stack/docker-compose.yml
# One DNS record: *.emails.orewire.com -> VPS IP (DNS only / grey cloud on Cloudflare)
#   emails.orewire.com            -> Outreach Console
#   lists.emails.orewire.com      -> Listmonk  (login: admin / dmmGAwNdePYl33zuivvIndqd)
#   postal.emails.orewire.com     -> Postal
#
# NOTE: default DB passwords are baked in for zero-config boot. The databases are
# internal-only (no host ports), but if this repo is public, override
# MARIADB_* / LISTMONK_DB_PASSWORD in Dokploy's environment editor.

x-postal-db: &postal-db
  MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-ulGYNpIWRzTMQIx24FxsZ6Mm}
  MARIADB_DATABASE: postal
  MARIADB_USER: postal
  MARIADB_PASSWORD: ${MARIADB_PASSWORD:-bqnl2tgU0sNIb8uY5PMXJ5v8}

services:
  # ---------------- Postal ----------------
  # One-shot bootstrap: generates the signing key (as root, then hands it to the postal
  # user) and installs/upgrades the database schema. Config comes from the read-only
  # ./postal.yml mount - no writes to /config needed for config.
  postal-init:
    image: ghcr.io/postalserver/postal:3.3.7
    user: "0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        echo "[postal-init] step 1/4: signing key"
        ruby -ropenssl -e 'File.write("/config/signing.key", OpenSSL::PKey::RSA.new(2048).to_pem) unless File.exist?("/config/signing.key")' && echo "[postal-init] signing key OK" || echo "[postal-init] WARNING: key generation failed"
        chown 999:999 /config/signing.key 2>/dev/null || true
        echo "[postal-init] step 2/4: postal initialize"
        postal initialize && echo "[postal-init] initialize OK"
        echo "[postal-init] step 3/4: ensure admin user"
        printf "admin@orewire.com\nAzeem\nAmjad\n6VkFkIzY2olwjLt8\n" | postal make-user >/dev/null 2>&1 && echo "[postal-init] admin created" || echo "[postal-init] admin already exists (skipped)"
        echo "[postal-init] step 4/4: bootstrap org/server/credentials/domains"
        (cd /opt/postal/app && bin/rails runner /postal-bootstrap.rb) | grep -v "^SMTP_KEY=\|^API_KEY=" > /data/dns-records.txt 2>&1
        cat /data/dns-records.txt
        echo "[postal-init] bootstrap done (records available at console /api/dns-records)"
    environment:
      POSTAL_CONFIG_FILE_PATH: /config/postal.yml
      POSTAL_POSTAL_SIGNING_KEY_PATH: /config/signing.key
      POSTAL_MAIN_DB_HOST: postal-mariadb
      POSTAL_MAIN_DB_PORT: "3306"
      POSTAL_MAIN_DB_USERNAME: postal
      POSTAL_MAIN_DB_PASSWORD: ${MARIADB_PASSWORD:-bqnl2tgU0sNIb8uY5PMXJ5v8}
      POSTAL_MAIN_DB_DATABASE: postal
      POSTAL_MESSAGE_DB_HOST: postal-mariadb
      POSTAL_MESSAGE_DB_PORT: "3306"
      POSTAL_MESSAGE_DB_USERNAME: root
      POSTAL_MESSAGE_DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:-ulGYNpIWRzTMQIx24FxsZ6Mm}
      POSTAL_MESSAGE_DB_DATABASE_NAME_PREFIX: postal
    volumes:
      - postal-config:/config
      - ./postal.yml:/config/postal.yml:ro
      - ./postal-bootstrap.rb:/postal-bootstrap.rb:ro
      - console-state:/data
    depends_on:
      postal-mariadb:
        condition: service_healthy
    networks: [email]

  postal-web:
    image: ghcr.io/postalserver/postal:3.3.7
    restart: unless-stopped
    command: postal web-server
    environment:
      POSTAL_POSTAL_WEB_HOSTNAME: ${POSTAL_HOST_DOMAIN:-postal.emails.orewire.com}
      POSTAL_POSTAL_WEB_PROTOCOL: https
      POSTAL_POSTAL_SMTP_HOSTNAME: ${POSTAL_HOST_DOMAIN:-postal.emails.orewire.com}
      POSTAL_POSTAL_SIGNING_KEY_PATH: /config/signing.key
      POSTAL_MAIN_DB_HOST: postal-mariadb
      POSTAL_MAIN_DB_PORT: "3306"
      POSTAL_MAIN_DB_USERNAME: postal
      POSTAL_MAIN_DB_PASSWORD: ${MARIADB_PASSWORD:-bqnl2tgU0sNIb8uY5PMXJ5v8}
      POSTAL_MAIN_DB_DATABASE: postal
      POSTAL_MESSAGE_DB_HOST: postal-mariadb
      POSTAL_MESSAGE_DB_PORT: "3306"
      POSTAL_MESSAGE_DB_USERNAME: root
      POSTAL_MESSAGE_DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:-ulGYNpIWRzTMQIx24FxsZ6Mm}
      POSTAL_MESSAGE_DB_DATABASE_NAME_PREFIX: postal
      POSTAL_WEB_SERVER_DEFAULT_PORT: "5000"
      POSTAL_WEB_SERVER_DEFAULT_BIND_ADDRESS: 0.0.0.0
    volumes:
      - postal-assets:/opt/postal/public/assets
      - postal-config:/config
      - ./postal.yml:/config/postal.yml:ro
    depends_on:
      postal-init:
        condition: service_completed_successfully
      postal-mariadb:
        condition: service_healthy
    networks: [email, dokploy-network]

  postal-smtp:
    image: ghcr.io/postalserver/postal:3.3.7
    restart: unless-stopped
    command: postal smtp-server
    ports:
      - "25:25"
    environment:
      POSTAL_POSTAL_SMTP_HOSTNAME: ${POSTAL_HOST_DOMAIN:-postal.emails.orewire.com}
      POSTAL_POSTAL_SIGNING_KEY_PATH: /config/signing.key
      POSTAL_MAIN_DB_HOST: postal-mariadb
      POSTAL_MAIN_DB_PORT: "3306"
      POSTAL_MAIN_DB_USERNAME: postal
      POSTAL_MAIN_DB_PASSWORD: ${MARIADB_PASSWORD:-bqnl2tgU0sNIb8uY5PMXJ5v8}
      POSTAL_MAIN_DB_DATABASE: postal
      POSTAL_MESSAGE_DB_HOST: postal-mariadb
      POSTAL_MESSAGE_DB_PORT: "3306"
      POSTAL_MESSAGE_DB_USERNAME: root
      POSTAL_MESSAGE_DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:-ulGYNpIWRzTMQIx24FxsZ6Mm}
      POSTAL_MESSAGE_DB_DATABASE_NAME_PREFIX: postal
      POSTAL_SMTP_SERVER_DEFAULT_PORT: "25"
      POSTAL_SMTP_SERVER_DEFAULT_BIND_ADDRESS: 0.0.0.0
      POSTAL_SMTP_SERVER_TLS_ENABLED: "false"
    volumes:
      - postal-config:/config
      - ./postal.yml:/config/postal.yml:ro
    depends_on:
      postal-init:
        condition: service_completed_successfully
      postal-mariadb:
        condition: service_healthy
    networks: [email]

  postal-worker:
    image: ghcr.io/postalserver/postal:3.3.7
    restart: unless-stopped
    command: postal worker
    environment:
      POSTAL_POSTAL_SIGNING_KEY_PATH: /config/signing.key
      POSTAL_MAIN_DB_HOST: postal-mariadb
      POSTAL_MAIN_DB_PORT: "3306"
      POSTAL_MAIN_DB_USERNAME: postal
      POSTAL_MAIN_DB_PASSWORD: ${MARIADB_PASSWORD:-bqnl2tgU0sNIb8uY5PMXJ5v8}
      POSTAL_MAIN_DB_DATABASE: postal
      POSTAL_MESSAGE_DB_HOST: postal-mariadb
      POSTAL_MESSAGE_DB_PORT: "3306"
      POSTAL_MESSAGE_DB_USERNAME: root
      POSTAL_MESSAGE_DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:-ulGYNpIWRzTMQIx24FxsZ6Mm}
      POSTAL_MESSAGE_DB_DATABASE_NAME_PREFIX: postal
    volumes:
      - postal-config:/config
      - ./postal.yml:/config/postal.yml:ro
    depends_on:
      postal-init:
        condition: service_completed_successfully
      postal-mariadb:
        condition: service_healthy
    networks: [email]

  postal-mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment: *postal-db
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [email]

  # ---------------- Listmonk ----------------
  listmonk-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD:-FIeZ1vWzXxNr8QT2zQZnpuIi}
      POSTGRES_DB: listmonk
    volumes:
      - listmonk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [email]

  listmonk:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    depends_on:
      listmonk-db:
        condition: service_healthy
    command: [sh, -c, "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:-FIeZ1vWzXxNr8QT2zQZnpuIi}
      LISTMONK_db__database: listmonk
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: "5432"
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-admin}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-dmmGAwNdePYl33zuivvIndqd}
      TZ: Etc/UTC
    networks: [email, dokploy-network]

  # ---------------- Outreach Console ----------------
  console:
    build: ../outreach/console
    image: orewire/outreach-console:latest
    restart: unless-stopped
    environment:
      CONSOLE_PORT: "8018"
      STATE_DIR: /data
      POSTAL_MESSAGE_DB_HOST: postal-mariadb
      POSTAL_DB_USER: root
      POSTAL_DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:-ulGYNpIWRzTMQIx24FxsZ6Mm}
      POSTAL_DB_PREFIX: postal-server-
    volumes:
      - console-state:/data
    networks: [email, dokploy-network]

  # ---------------- Reacher (mailbox verification) ----------------
  email-verifier:
    image: reacherhq/backend:latest
    restart: unless-stopped
    networks: [email]

networks:
  email:
  dokploy-network:
    external: true

volumes:
  mariadb-data:
  listmonk-data:
  postal-assets:
  postal-config:
  console-state:
